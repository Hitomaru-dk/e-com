<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="images/favicon.png" type="">
  <title>Feane — Register</title>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <link href="css/font-awesome.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />
  <style>
    .register_section {
      min-height: 100vh;
      background-color: #f8f8f8;
      display: flex;
      align-items: center;
      padding: 90px 0 40px;
    }
    .register_box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      padding: 44px 40px 36px;
      max-width: 480px;
      margin: 0 auto;
    }
    .register_box .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .register_box .brand span {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      font-weight: bold;
      color: #ffbe33;
    }
    .register_box h4 {
      text-align: center;
      font-weight: 700;
      color: #0c0c0c;
      margin-bottom: 4px;
    }
    .register_box .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      display: block;
    }
    .form-control {
      border-radius: 8px;
      border: 1.5px solid #e0e0e0;
      padding: 11px 16px;
      font-size: 14px;
      transition: border-color 0.2s;
      width: 100%;
    }
    .form-control:focus {
      border-color: #ffbe33;
      box-shadow: 0 0 0 3px rgba(255,190,51,0.15);
      outline: none;
    }
    .form-control.is-invalid { border-color: #e74c3c; }
    .form-control.is-valid   { border-color: #27ae60; }

    .pw-wrap { position: relative; }
    .pw-wrap .form-control { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #aaa; background: none; border: none;
    }
    .pw-toggle:hover { color: #ffbe33; }

    /* Password strength checklist */
    .pw-rules {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 12px;
    }
    .pw-rules .rule {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; color: #aaa; transition: color 0.2s;
    }
    .pw-rules .rule.pass { color: #27ae60; }
    .pw-rules .rule.fail { color: #e74c3c; }
    .pw-rules .rule i { width: 14px; text-align: center; }

    .btn-register {
      width: 100%;
      background-color: #ffbe33;
      color: #0c0c0c;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      padding: 13px;
      margin-top: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-register:hover { background-color: #e6a800; transform: translateY(-1px); }
    .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .alert-box {
      display: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }
    .alert-error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; }
    .alert-success { background: #f0fff4; border: 1px solid #b2dfdb; color: #1a7a4a; }

    .bottom-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #888;
    }
    .bottom-link a { color: #ffbe33; font-weight: 600; text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid #0c0c0c; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="header_section" style="position:fixed;top:0;width:100%;z-index:999;">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="index.html"><span>Feane</span></a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="book.html">Book Table</a></li>
          </ul>
          <div class="user_option">
            <a href="login.html" class="user_link" id="userIconLink">
              <i class="fa fa-user" aria-hidden="true"></i>
            </a>
            <span id="userGreeting" style="font-size:14px;margin-left:6px;"></span>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <section class="register_section">
    <div class="container">
      <div class="register_box">
        <div class="brand"><span>Feane</span></div>
        <h4>Create Account</h4>
        <p class="subtitle">Join us and enjoy your meals</p>

        <!-- Name -->
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="name" class="form-control" placeholder="Your first name" />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email (Username)</label>
          <input type="email" id="username" class="form-control" placeholder="you@example.com" autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" class="form-control" placeholder="Create a password" oninput="checkPassword()" />
            <button class="pw-toggle" type="button" onclick="togglePw('password','icon1')">
              <i class="fa fa-eye" id="icon1"></i>
            </button>
          </div>
          <!-- Live password rules -->
          <div class="pw-rules" id="pwRules">
            <div class="rule" id="rule-len"><i class="fa fa-circle"></i> At least 8 characters</div>
            <div class="rule" id="rule-upper"><i class="fa fa-circle"></i> At least 1 uppercase letter (A–Z)</div>
            <div class="rule" id="rule-special"><i class="fa fa-circle"></i> At least 1 special character (!@#$%^&*)</div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="pw-wrap">
            <input type="password" id="confirm" class="form-control" placeholder="Repeat your password" oninput="checkConfirm()" />
            <button class="pw-toggle" type="button" onclick="togglePw('confirm','icon2')">
              <i class="fa fa-eye" id="icon2"></i>
            </button>
          </div>
        </div>

        <button class="btn-register" id="regBtn" onclick="doRegister()">Create Account</button>

        <div class="alert-box alert-error"   id="alertError"></div>
        <div class="alert-box alert-success" id="alertSuccess"></div>

        <p class="bottom-link">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/auth-nav.js"></script>
  <script>
    function togglePw(id, iconId) {
      const el = document.getElementById(id);
      const ic = document.getElementById(iconId);
      if (el.type === 'password') { el.type = 'text'; ic.className = 'fa fa-eye-slash'; }
      else { el.type = 'password'; ic.className = 'fa fa-eye'; }
    }

    const RULES = {
      len:     { el: 'rule-len',     test: pw => pw.length >= 8 },
      upper:   { el: 'rule-upper',   test: pw => /[A-Z]/.test(pw) },
      special: { el: 'rule-special', test: pw => /[!@#$%^&*]/.test(pw) }
    };

    function checkPassword() {
      const pw = document.getElementById('password').value;
      Object.entries(RULES).forEach(([key, rule]) => {
        const el = document.getElementById(rule.el);
        const ok = rule.test(pw);
        el.className = 'rule ' + (pw.length === 0 ? '' : ok ? 'pass' : 'fail');
        el.querySelector('i').className = ok ? 'fa fa-check-circle' : 'fa fa-times-circle';
      });
      checkConfirm();
    }

    function checkConfirm() {
      const pw  = document.getElementById('password').value;
      const cfm = document.getElementById('confirm').value;
      const el  = document.getElementById('confirm');
      if (!cfm) { el.className = 'form-control'; return; }
      el.className = 'form-control ' + (pw === cfm ? 'is-valid' : 'is-invalid');
    }

    function isPasswordValid(pw) {
      return Object.values(RULES).every(r => r.test(pw));
    }

    function showError(msg) {
      const el = document.getElementById('alertError');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('alertSuccess').style.display = 'none';
    }
    function showSuccess(msg) {
      const el = document.getElementById('alertSuccess');
      el.textContent = msg; el.style.display = 'block';
      document.getElementById('alertError').style.display = 'none';
    }
    function hideAlerts() {
      document.getElementById('alertError').style.display = 'none';
      document.getElementById('alertSuccess').style.display = 'none';
    }

    async function doRegister() {
      hideAlerts();
      const name     = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const btn      = document.getElementById('regBtn');

      // --- Frontend validations ---
      if (!name)     return showError('Please enter your first name.');
      if (!username) return showError('Please enter your email address.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username))
        return showError('Please enter a valid email address.');
      if (!isPasswordValid(password))
        return showError('Password must be at least 8 characters with 1 uppercase and 1 special character.');
      if (password !== confirm)
        return showError('Passwords do not match.');

      // --- Call backend ---
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password })
        });
        const data = await res.json();

        if (data.success) {
          showSuccess('Account created! Redirecting to login...');
          setTimeout(() => { window.location.href = 'login.html'; }, 1800);
        } else {
          showError(data.message || 'Registration failed.');
          btn.disabled = false;
          btn.innerHTML = 'Create Account';
        }
      } catch (err) {
        showError('Cannot connect to server. Make sure backend is running on port 3000.');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }
  </script>
  <script src="js/cart.js"></script>
</body>
</html>
