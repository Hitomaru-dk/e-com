<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="images/favicon.png" type="">
  <title>Feane — My Profile</title>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <link href="css/font-awesome.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />
  <style>
    .profile_section {
      min-height: 100vh;
      background-color: #f8f8f8;
      padding: 100px 0 60px;
    }
    .profile_card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      overflow: hidden;
      max-width: 600px;
      margin: 0 auto;
    }
    .profile_banner {
      background: linear-gradient(135deg, #ffbe33 0%, #e6a800 100%);
      padding: 40px 32px 60px;
      text-align: center;
      position: relative;
    }
    .profile_avatar {
      width: 96px;
      height: 96px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .profile_avatar i {
      font-size: 44px;
      color: #ffbe33;
    }
    .profile_banner h3 {
      color: #0c0c0c;
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .profile_banner p {
      color: rgba(12,12,12,0.65);
      font-size: 14px;
      margin: 0;
    }
    .profile_body {
      padding: 32px;
    }
    .profile_body h5 {
      font-weight: 700;
      color: #0c0c0c;
      margin-bottom: 20px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .info_row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info_row:last-child { border-bottom: none; }
    .info_icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff8e6;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .info_icon i { color: #ffbe33; font-size: 16px; }
    .info_label {
      font-size: 12px;
      color: #aaa;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .info_value {
      font-size: 15px;
      color: #0c0c0c;
      font-weight: 500;
    }
    .profile_footer {
      padding: 0 32px 32px;
      display: flex;
      gap: 12px;
    }
    .btn-logout {
      flex: 1;
      background: #fff;
      color: #c0392b;
      border: 1.5px solid #ffcccc;
      border-radius: 8px;
      padding: 11px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: #fff0f0;
      border-color: #c0392b;
    }
    .btn-home {
      flex: 1;
      background: #ffbe33;
      color: #0c0c0c;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-home:hover { background: #e6a800; color: #0c0c0c; }
    .member_badge {
      display: inline-block;
      background: #0c0c0c;
      color: #ffbe33;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      margin-top: 8px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- header -->
  <header class="header_section" style="position:fixed;top:0;width:100%;z-index:999;">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="index.html"><span>Feane</span></a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="book.html">Book Table</a></li>
          </ul>
          <div class="user_option">
            <a href="login.html" class="user_link" id="userIconLink">
                <i class="fa fa-user" aria-hidden="true"></i>
              </a>
              <span id="userGreeting" style="font-size:14px;margin-left:6px;"></span>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- profile section -->
  <section class="profile_section">
    <div class="container">
      <div class="profile_card">

        <!-- banner -->
        <div class="profile_banner">
          <div class="profile_avatar">
            <i class="fa fa-user"></i>
          </div>
          <h3 id="displayName">Loading...</h3>
          <p id="displayEmail">—</p>
          <span class="member_badge">FEANE MEMBER</span>
        </div>

        <!-- info -->
        <div class="profile_body">
          <h5>Account Information</h5>

          <div class="info_row">
            <div class="info_icon"><i class="fa fa-user"></i></div>
            <div>
              <div class="info_label">First Name</div>
              <div class="info_value" id="infoName">—</div>
            </div>
          </div>

          <div class="info_row">
            <div class="info_icon"><i class="fa fa-envelope"></i></div>
            <div>
              <div class="info_label">Email</div>
              <div class="info_value" id="infoEmail">—</div>
            </div>
          </div>

          <div class="info_row">
            <div class="info_icon"><i class="fa fa-calendar"></i></div>
            <div>
              <div class="info_label">Member Since</div>
              <div class="info_value" id="infoDate">—</div>
            </div>
          </div>
        </div>

        <!-- footer buttons -->
        <div class="profile_footer">
          <button class="btn-logout" onclick="logout()">
            <i class="fa fa-sign-out"></i> Logout
          </button>
          <a href="index.html" class="btn-home">
            <i class="fa fa-home" style="margin-right:6px"></i> Home
          </a>
        </div>

      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script>
    // Guard: redirect to login if not logged in
    const raw = localStorage.getItem('feane_user');
    if (!raw) {
      window.location.href = 'login.html';
    }

    const user = JSON.parse(raw);

    // Populate profile
    document.getElementById('displayName').textContent = user.first_name;
    document.getElementById('displayEmail').textContent = user.username;
    document.getElementById('infoName').textContent = user.first_name;
    document.getElementById('infoEmail').textContent = user.username;

    // Format date nicely
    const d = new Date(user.date_of_registration);
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('infoDate').textContent = d.toLocaleDateString('en-US', options);

    function logout() {
      localStorage.removeItem('feane_user');
      window.location.href = 'login.html';
    }
  </script>

  <!-- User greeting script -->
  <script>
    (function() {
      var raw = localStorage.getItem('feane_user');
      var link = document.getElementById('userIconLink');
      var greeting = document.getElementById('userGreeting');
      if (raw) {
        var user = JSON.parse(raw);
        if (link) { link.href = 'profile.html'; link.style.color = '#ffbe33'; }
        if (greeting) {
          greeting.innerHTML = 'Hello! <a href="profile.html" style="color:#ffbe33;font-weight:700;text-decoration:none;">' + user.first_name + '</a>';
        }
      } else {
        if (link) { link.href = 'login.html'; link.style.color = '#ffffff'; }
        if (greeting) {
          greeting.innerHTML = '<a href="login.html" style="color:#ffffff;font-weight:600;text-decoration:none;">Login</a>';
        }
      }
    })();
  </script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
